<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            transition: background-color 0.5s, color 0.5s;
        }
        h1, h2, h3 {
            color: #ffffff;
        }
        /* Responsive styling */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 1.5em;
            }
        }
        @media (min-width: 601px) {
            body {
                padding: 20px;
            }
            h1 {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Your Responsive Page</h1>
    </header>
    <main>
        <section>
            <h2>About This Page</h2>
            <p>This is a professional HTML structure with responsive design and dark mode.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Delugoss</p>
    </footer>
</body>
</html>
